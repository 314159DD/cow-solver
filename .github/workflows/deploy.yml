name: Build & Deploy

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "plan/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

# ─── Concurrency: Only one deploy at a time per branch ───────────────────────
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel a running deploy; queue it

# ─── Environment ─────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cow-solver

jobs:
  # ── 1. Build & Push Docker Image ──────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify image size
        run: |
          SIZE=$(docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null | \
            jq '[.layers[].size] | add // 0' || echo "0")
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "Image compressed size: ~${SIZE_MB}MB"
          # Warn (don't fail) if large
          if [[ $SIZE_MB -gt 150 ]]; then
            echo "::warning::Image size ${SIZE_MB}MB exceeds 150MB threshold"
          fi

  # ── 2. Test ───────────────────────────────────────────────────────────────
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo test
        run: cargo test --workspace
        env:
          RPC_URL: ""   # Tests must not require a live RPC

  # ── 3. Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: http://${{ secrets.VPS_HOST }}:${{ secrets.SOLVER_PORT || '8000' }}/health

    steps:
      - name: Checkout (for deploy script)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.version }}
          RPC_URL: ${{ secrets.RPC_URL }}
          CHAIN_ID: ${{ secrets.CHAIN_ID || '1' }}
          SOLVER_PORT: ${{ secrets.SOLVER_PORT || '8000' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,RPC_URL,CHAIN_ID,SOLVER_PORT,LOG_LEVEL,REGISTRY,IMAGE_NAME
          script: |
            set -euo pipefail

            # Pull latest deploy script from the repo
            cd ~/cow-solver || git clone ${{ github.server_url }}/${{ github.repository }} ~/cow-solver
            cd ~/cow-solver
            git fetch origin main
            git checkout origin/main -- scripts/deploy.sh docker-compose.yml

            # Log into GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Run zero-downtime deploy
            export IMAGE_NAME="${REGISTRY}/${IMAGE_NAME}"
            export IMAGE_TAG="${IMAGE_TAG}"
            export RPC_URL="${RPC_URL}"
            export CHAIN_ID="${CHAIN_ID}"
            export SOLVER_PORT="${SOLVER_PORT}"
            export LOG_LEVEL="${LOG_LEVEL}"
            bash scripts/deploy.sh "${IMAGE_NAME}:${IMAGE_TAG}"

            echo "Deploy complete - $(date -u)"

      - name: Verify deployment health
        run: |
          echo "Checking solver health..."
          for i in {1..12}; do
            if curl -sf --max-time 5 "http://${{ secrets.VPS_HOST }}:${{ secrets.SOLVER_PORT || '8000' }}/health"; then
              echo "Solver is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Solver health check failed after 60s"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check logs above."
          echo "To rollback manually:"
          echo "  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          echo "  docker run -d --name cow-solver --restart always \\"
          echo "    -p 8000:8000 -e RPC_URL=... <previous-image>"
