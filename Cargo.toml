[workspace]
members = [
    "solver-engine",
    "shared",
    "benchmarks",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Steven Obst"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Ethereum / alloy — serde_with (transitive dep) requires rustc 1.88; we have 1.87
# Implement RPC client with raw reqwest JSON-RPC calls for Sprint 1.
# Enable alloy when rustc is upgraded to 1.88+.
# alloy = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# WebSocket (for real-time pool event subscriptions)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Parallel execution
rayon = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config / env
dotenvy = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

# Config
toml = "0.8"

# Numeric types
primitive-types = { version = "0.13", features = ["serde"] }

# Graph algorithms
petgraph = "0.7"

# Database (auction replay)
rusqlite = { version = "0.32", features = ["bundled"] }

# Concurrent data structures (pool indexer cache)
dashmap = "6"

# Compression (auction log storage)
flate2 = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Hex encoding/decoding
hex = "0.4"

# Protobuf (Bebop Price API)
prost = "0.13"
