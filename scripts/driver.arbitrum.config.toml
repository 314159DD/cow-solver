# scripts/driver.arbitrum.config.toml
#
# CoW Protocol driver configuration for Arbitrum One (chain 42161).
#
# Arbitrum is the required first chain for new solver participants.
# Key differences from mainnet:
#   - Chain ID: 42161
#   - Gas price: ~0.01-0.1 gwei (vs 10-50 gwei mainnet)
#   - Block time: ~0.25s (vs 12s mainnet)
#   - Gas cost = L2 execution + L1 calldata posting to Ethereum
#
# Usage:
#   export RPC_URL=https://arb-mainnet.g.alchemy.com/v2/YOUR_KEY
#   export CHAIN_ID=42161
#   docker-compose up -d
#   # (or run with driver profile)
#   docker-compose --profile driver up
#
# For shadow competition on Arbitrum:
#   1. Join: https://t.me/cowprotocolsolver
#   2. Set PUBLIC_URL to your ngrok/VPS URL
#   3. Request Arbitrum shadow competition registration

[contracts]
# CoW Protocol Settlement contract — same address on all supported chains.
gp_v2_settlement = "0x9008D19f58AAbD9eD0D60971565AA8510560ab41"

[[solver]]
# Display name for this solver in competition logs
name = "cow-solver-arb"

# Solver endpoint — use ngrok URL for shadow competition
# endpoint = "https://YOUR_NGROK_URL"
endpoint = "http://localhost:8000"

# Solver signing address on Arbitrum
# Must hold ETH on Arbitrum for gas, and may require bonding pool stake for production
# Replace with actual address before going to production
account = "0x0000000000000000000000000000000000000001"

